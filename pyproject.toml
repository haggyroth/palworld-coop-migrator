[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palmigrate"
version = "0.1.0"
description = "Migrate Palworld co-op worlds to a dedicated server, including modern Oodle (PlM) saves"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "haggyroth" }]
keywords = ["palworld", "savegame", "gvas", "oodle", "dedicated-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Required to read modern PlM (Oodle) saves. Kept optional so that PlZ-only
# workflows, and the test suite, run with no native dependency at all.
oodle = ["pyooz>=0.0.8"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    # Statically asserts the codebase really runs on the oldest Python we
    # advertise. Caught Path.write_text(newline=...), which is 3.10+ and would
    # have raised TypeError for any 3.9 user writing a settings file.
    "vermin>=1.6",
]

[project.scripts]
palmigrate = "palmigrate.cli:main"

[project.urls]
Homepage = "https://github.com/haggyroth/palworld-coop-migrator"
Issues = "https://github.com/haggyroth/palworld-coop-migrator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/palmigrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["palmigrate"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "except ImportError:",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
